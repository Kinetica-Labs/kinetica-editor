<title>Kinetica Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: a sticky bar (name, language), a rail of chapters on the left, one chapter at a time on the right.
   The palette is the editor's own: its slate panels, the blue of a pressed tool, the orange outline of a selection. */
:root {
  --bg: #171b22; --panel: #1f242d; --raise: #272d38; --line: #343c4a;
  --fg: #e7ebf2; --muted: #9aa5b8; --accent: #5b9bf0; --accent-ink: #0d1626; --select: #f2a33a; --go: #4cc45a;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --display: "Manrope", "Segoe UI", system-ui, sans-serif;
  --text: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5f9; --panel: #ffffff; --raise: #e9edf4; --line: #d3dae6;
    --fg: #18202d; --muted: #5a667a; --accent: #1f62c4; --accent-ink: #ffffff; --select: #b96a00; --go: #1e8a34;
    --shadow: 0 10px 30px rgba(30, 45, 70, .16);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f5f9; --panel: #ffffff; --raise: #e9edf4; --line: #d3dae6;
  --fg: #18202d; --muted: #5a667a; --accent: #1f62c4; --accent-ink: #ffffff; --select: #b96a00; --go: #1e8a34;
  --shadow: 0 10px 30px rgba(30, 45, 70, .16);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.6 var(--text); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--select); outline-offset: 2px; border-radius: 4px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar-in, .page { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.name { font: 800 18px/1.2 var(--display); letter-spacing: .01em; margin-right: auto; color: var(--fg); text-decoration: none; }
.name span { color: var(--muted); font-weight: 600; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.lang button { font: 600 13px/1 var(--text); padding: 8px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.page { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 32px; padding-block: 24px 64px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 68px); display: flex; flex-direction: column; gap: 2px; }
.rail a { display: block; padding: 8px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 15px; line-height: 1.35; }
.rail a:hover { background: var(--raise); color: var(--fg); }
.rail a[aria-current="page"] { background: var(--raise); color: var(--fg); box-shadow: inset 3px 0 0 var(--select); }
.doc { min-width: 0; }

.doc h1 { font: 800 clamp(28px, 4.2vw, 42px)/1.12 var(--display); margin: 0 0 12px; text-wrap: balance; }
.doc h2 { font: 800 clamp(24px, 3.2vw, 32px)/1.18 var(--display); margin: 0 0 14px; text-wrap: balance; }
.doc h3 { font: 700 20px/1.3 var(--display); margin: 34px 0 10px; text-wrap: balance; }
.doc p, .doc li { max-width: 68ch; }
.doc p { margin: 0 0 14px; }
.doc ol, .doc ul { margin: 0 0 16px; padding-left: 22px; }
.doc li { margin-bottom: 6px; }
.doc blockquote { margin: 18px 0; padding: 14px 18px; background: var(--raise); border-radius: 10px; border-left: 3px solid var(--go); }
.doc blockquote p { margin: 0; }
.doc code { font: 500 13px/1 var(--mono); padding: 3px 7px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; background: var(--panel); white-space: nowrap; }
.doc pre { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.doc pre code { border: 0; padding: 0; white-space: pre; background: none; line-height: 1.6; }
.wide { overflow-x: auto; margin: 0 0 18px; }
.doc table { border-collapse: collapse; width: 100%; font-size: 15px; }
.doc th { text-align: left; font: 600 13px/1.3 var(--text); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); }
.doc td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
.doc img { display: block; max-width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); cursor: zoom-in; background: var(--panel); }
.doc p > img { margin: 4px 0 6px; }
.doc img[height="22"] { display: inline-block; height: 22px; width: auto; min-width: 0; margin: 0 2px 0 0; vertical-align: -5px; border: 0; border-radius: 5px; cursor: default; }
.doc td img { min-width: 120px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin: 6px 0 8px; }
.card { display: flex; flex-direction: column; gap: 4px; padding: 10px 10px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); text-decoration: none; }
.card:hover { border-color: var(--accent); }
.card img { aspect-ratio: 16 / 9; object-fit: cover; object-position: left top; width: 100%; cursor: pointer; margin-bottom: 6px; }
.card b { font: 700 16px/1.3 var(--display); }
.card small { color: var(--muted); font-size: 14px; line-height: 1.4; }

.stepper { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 8px; }
.stepper h3 { margin-top: 0; }
.dots { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.dots button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--raise); color: var(--muted); font: 600 14px/1 var(--text); cursor: pointer; }
.dots button.done { background: transparent; color: var(--go); border-color: var(--go); }
.dots button[aria-current="step"] { background: var(--select); border-color: var(--select); color: #1a1205; }
.dots span { color: var(--muted); font-size: 14px; margin-left: 4px; }
.nav { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.btn { font: 600 15px/1 var(--text); padding: 12px 18px; border-radius: 9px; border: 1px solid var(--line); background: var(--raise); color: var(--fg); cursor: pointer; text-decoration: none; }
.btn.main { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 40px; flex-wrap: wrap; }

.find { width: 100%; max-width: 420px; font: 16px/1.2 var(--text); padding: 11px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); margin-bottom: 14px; }
.keys { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.keys li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; margin: 0; max-width: none; }
.none { color: var(--muted); }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 14px; margin: 0 0 14px; max-width: 68ch; }
summary { cursor: pointer; padding: 11px 0; font-weight: 600; color: var(--accent); }
details p { padding-bottom: 12px; margin: 0; color: var(--fg); }
.qa { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 13px 16px; margin-bottom: 8px; max-width: 76ch; }
.qa b { display: block; margin-bottom: 4px; }
.qa p { margin: 0; color: var(--muted); }
.hero { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 22px; align-items: center; margin: 6px 0 26px; }
.hero img { width: 100%; cursor: default; }
.hero video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 10px; border: 1px solid var(--line); background: #000; }
.hero.film { grid-template-columns: minmax(0, 1fr); } /* the film the page's width, the way in under it */
.hero blockquote { margin: 0; background: none; border: 0; padding: 0; font: 600 19px/1.45 var(--display); }
.hero .nav { margin-top: 16px; }
@media (max-width: 980px) { .hero { grid-template-columns: minmax(0, 1fr); } }

dialog { border: 0; padding: 0; background: transparent; max-width: min(96vw, 1500px); }
dialog::backdrop { background: rgba(8, 10, 14, .82); }
dialog img { display: block; max-width: 100%; max-height: 86vh; border-radius: 10px; box-shadow: var(--shadow); cursor: zoom-out; }
dialog p { color: #e7ebf2; text-align: center; margin: 10px 0 0; font-size: 15px; }
.state { color: var(--muted); padding: 40px 0; }

@media (max-width: 820px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 14px; padding-block: 12px 48px; }
  .rail { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  .rail a { white-space: nowrap; background: var(--panel); border: 1px solid var(--line); padding: 7px 12px; font-size: 14px; }
  .rail a[aria-current="page"] { box-shadow: none; border-color: var(--select); }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<header class="bar">
  <div class="bar-in">
    <a class="name" href="#" id="home">Kinetica <span id="subtitle">руководство</span></a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-ru" aria-pressed="true">Русский</button>
      <button type="button" id="lang-en" aria-pressed="false">English</button>
    </div>
  </div>
</header>
<div class="page">
  <nav class="rail" id="rail" aria-label="Chapters"></nav>
  <main class="doc" id="doc"><p class="state" id="state">Загружаю руководство…</p></main>
</div>
<dialog id="zoom"><img id="zoom-img" alt=""><p id="zoom-text"></p></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script>
// The guide's text is the repository's own Markdown (docs/interface.md, docs/interface.en.md), read as published beside
// this page: one source for the file a person reads on GitHub and for this site.
const FILES = { ru: "interface.md", en: "interface.en.md" };
const WORDS = {
  ru: { subtitle: "руководство", start: "Начало", back: "Назад", next: "Дальше", step: "Шаг", of: "из", done: "Урок пройден",
        find: "Найти клавишу: пуск, группа, F9…", none: "Ничего не нашлось", loading: "Загружаю руководство…",
        failed: "Не удалось загрузить текст руководства.", begin: "Начать: первые пять минут", browse: "Справочник по окну",
        moving: "Шар разбивает стену из кирпичей" },
  en: { subtitle: "guide", start: "Start", back: "Back", next: "Next", step: "Step", of: "of", done: "Lesson done",
        find: "Find a key: play, group, F9…", none: "Nothing found", loading: "Loading the guide…",
        failed: "The guide's text could not be loaded.", begin: "Start: the first five minutes", browse: "The window, by task",
        moving: "A ball knocks down a wall of bricks" },
};
const HIDDEN = ["retake"]; // how the pictures are retaken: for the repository's readers, not for a learner
const doc = document.getElementById("doc"), rail = document.getElementById("rail"), zoom = document.getElementById("zoom");
let language = "ru", sections = [], step = 0;

function remembered(key, otherwise) {
  try { return localStorage.getItem(key) ?? otherwise; } catch (e) { return otherwise; }
}
function remember(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* a private window: the page works without it */ }
}
function make(tag, attributes = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attributes)) k === "class" ? el.className = v : k === "text" ? el.textContent = v : el.setAttribute(k, v);
  el.append(...children);
  return el;
}

// The Markdown as chapters: an <a id> before a heading starts one; a second-level heading with no anchor of its
// own (the help, the note for the repository's readers) starts one too.
function chapters(html) {
  const root = make("div");
  root.innerHTML = html;
  const spare = ["help", "retake"], out = [{ id: "intro", nodes: [] }];
  for (const el of [...root.children]) {
    const anchor = el.matches("a[id]") ? el : el.matches("p") && el.children.length === 1 && !el.textContent.trim() ? el.querySelector("a[id]") : null;
    if (anchor) { out.push({ id: anchor.id, nodes: [] }); continue; }
    const last = out[out.length - 1];
    if (el.tagName === "H2" && last.id !== "intro" && last.nodes.some(n => n.tagName === "H2")) out.push({ id: spare.shift() || "more-" + out.length, nodes: [] });
    out[out.length - 1].nodes.push(el);
  }
  for (const s of out) s.title = s.id === "intro" ? WORDS[language].start : (s.nodes.find(n => n.tagName === "H2")?.textContent ?? s.id);
  return out.filter(s => !HIDDEN.includes(s.id));
}

function tidy(node) {
  for (const a of node.querySelectorAll('a[href$=".md"]')) {
    if (/interface(\.en)?\.md$/.test(a.getAttribute("href"))) a.closest("p")?.remove(); // the language is switched above
    else a.replaceWith(...a.childNodes);                                                // a file of the repository, not of this site
  }
  for (const table of node.querySelectorAll("table")) {
    if (table.closest(".wide")) continue;
    const wrap = make("div", { class: "wide" });
    table.replaceWith(wrap);
    wrap.append(table);
  }
  for (const img of node.querySelectorAll("img")) img.loading = "lazy";
}

// The contents of the first page: the table of pictures becomes a grid of cards.
function cards(node) {
  const table = [...node.querySelectorAll("table")].find(t => t.querySelector('td a[href^="#"]'));
  if (!table) return;
  const grid = make("div", { class: "cards" });
  for (const cell of table.querySelectorAll("td")) {
    const link = cell.querySelector("a"), img = cell.querySelector("img");
    if (!link || !img) continue;
    const about = [...cell.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent.trim()).join(" ");
    grid.append(make("a", { class: "card", href: link.getAttribute("href") }, make("img", { src: img.getAttribute("src"), alt: "" }),
                     make("b", { text: link.textContent.trim() }), make("small", { text: about })));
  }
  (table.closest(".wide") ?? table).replaceWith(grid);
}

// The first screen: the result, moving, and one main way in - the still picture of the window goes below it. The film
// at the guide's head (tools/showcase_film.py), when there is one, is that result: the page's width, the way in under it.
function opening(nodes) {
  const w = WORDS[language], at = nodes.findIndex(n => n.tagName === "BLOCKQUOTE");
  if (at < 0) return nodes;
  const film = nodes.slice(0, at).find(n => n.tagName === "VIDEO");
  const hero = make("div", { class: film ? "hero film" : "hero" },
                    film ?? make("img", { src: "images/ui/first-result.png", alt: w.moving, width: "480", height: "233" }),
                    make("div", { class: "hero-say" }, nodes[at], make("div", { class: "nav" },
                         make("a", { class: "btn main", href: "#first", text: w.begin + " →" }), make("a", { class: "btn", href: "#map", text: w.browse }))));
  const picture = n => n.querySelector?.('img:not([height="22"])'); // an icon in a sentence does not make it a picture
  const before = nodes.slice(0, at).filter(n => n !== film);
  return [...before.filter(n => !picture(n)), hero, ...nodes.slice(at + 1), ...before.filter(picture)];
}

// The first lesson: one step on the screen at a time.
function lesson(nodes) {
  const w = WORDS[language], before = [], steps = [];
  for (const n of nodes) n.tagName === "H3" ? steps.push([n]) : steps.length ? steps[steps.length - 1].push(n) : before.push(n);
  const box = make("div", { class: "stepper" }), dots = make("div", { class: "dots" }), body = make("div"), count = make("span");
  const back = make("button", { class: "btn", type: "button", id: "step-back", text: "← " + w.back });
  const next = make("button", { class: "btn main", type: "button", id: "step-next" });
  const show = k => {
    step = Math.max(0, Math.min(steps.length - 1, k));
    remember("kinetica-guide-step", String(step));
    body.replaceChildren(...steps[step]);
    [...dots.querySelectorAll("button")].forEach((b, i) => {
      b.className = i < step ? "done" : "";
      i === step ? b.setAttribute("aria-current", "step") : b.removeAttribute("aria-current");
    });
    count.textContent = `${w.step} ${step + 1} ${w.of} ${steps.length}`;
    back.disabled = step === 0;
    next.textContent = step === steps.length - 1 ? w.done + " ✓" : w.next + " →";
    next.disabled = step === steps.length - 1;
  };
  steps.forEach((_, i) => dots.append(make("button", { type: "button", "aria-label": `${w.step} ${i + 1}`, text: String(i + 1) })));
  dots.append(count);
  dots.addEventListener("click", e => { const i = [...dots.querySelectorAll("button")].indexOf(e.target); if (i >= 0) show(i); });
  back.addEventListener("click", () => show(step - 1));
  next.addEventListener("click", () => show(step + 1));
  box.append(dots, body, make("div", { class: "nav" }, back, next));
  show(Math.min(Number(remembered("kinetica-guide-step", "0")) || 0, steps.length - 1));
  return [...before, box];
}

// The cheat sheet: a table of pairs becomes a list a word filters.
function keys(nodes) {
  const w = WORDS[language], table = nodes.map(n => n.matches?.("table") ? n : n.querySelector?.("table")).find(Boolean);
  if (!table) return nodes;
  const list = make("ul", { class: "keys" }), none = make("p", { class: "none", text: w.none, hidden: "" });
  for (const row of table.querySelectorAll("tbody tr")) {
    const cells = [...row.children];
    for (const at of [0, 3]) {
      if (!cells[at] || !cells[at + 1] || !cells[at].textContent.trim()) continue;
      const item = make("li", {}, make("span", { text: cells[at].textContent.trim() }), make("span"));
      item.lastChild.innerHTML = cells[at + 1].innerHTML;
      list.append(item);
    }
  }
  const find = make("input", { class: "find", id: "key-find", type: "search", placeholder: w.find, "aria-label": w.find });
  find.addEventListener("input", () => {
    const q = find.value.trim().toLowerCase();
    let shown = 0;
    for (const li of list.children) shown += (li.hidden = !!q && !li.textContent.toLowerCase().includes(q)) ? 0 : 1;
    none.hidden = shown > 0;
  });
  return nodes.map(n => n === table || n.contains?.(table) ? [find, list, none] : [n]).flat();
}

// "When something goes wrong": every answer in sight - what is folded away is found less often.
function help(nodes) {
  const table = nodes.map(n => n.matches?.("table") ? n : n.querySelector?.("table")).find(Boolean);
  if (!table) return nodes;
  const list = [...table.querySelectorAll("tbody tr")].map(row => {
    const answer = make("p");
    answer.innerHTML = row.children[1].innerHTML;
    return make("div", { class: "qa" }, make("b", { text: row.children[0].textContent.trim() }), answer);
  });
  return nodes.map(n => n === table || n.contains?.(table) ? list : [n]).flat();
}

function route() {
  const id = location.hash.slice(1), at = Math.max(0, sections.findIndex(s => s.id === id)), s = sections[at], w = WORDS[language];
  let nodes = s.nodes;
  if (s.id === "intro") nodes = opening(nodes);
  if (s.id === "first") nodes = lesson(nodes);
  if (s.id === "keys") nodes = keys(nodes);
  if (s.id === "help") nodes = help(nodes);
  const pager = make("div", { class: "pager" });
  if (at > 0) pager.append(make("a", { class: "btn", href: "#" + (sections[at - 1].id === "intro" ? "" : sections[at - 1].id), text: "← " + sections[at - 1].title }));
  if (at < sections.length - 1) pager.append(make("a", { class: "btn main", href: "#" + sections[at + 1].id, text: sections[at + 1].title + " →" }));
  doc.replaceChildren(...nodes, pager);
  for (const a of rail.children) a.getAttribute("href") === "#" + (s.id === "intro" ? "" : s.id) ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current");
  rail.querySelector('[aria-current="page"]')?.scrollIntoView({ block: "nearest", inline: "nearest" });
  window.scrollTo(0, 0);
}

async function load(to) {
  language = to;
  remember("kinetica-guide-language", to);
  document.documentElement.lang = to;
  document.getElementById("subtitle").textContent = WORDS[to].subtitle;
  for (const l of Object.keys(FILES)) document.getElementById("lang-" + l).setAttribute("aria-pressed", String(l === to));
  try {
    const answer = await fetch(FILES[to], { cache: "no-cache" }); // asked of the server each time: a new guide is seen at once, not after the cache runs out
    if (!answer.ok) throw new Error(answer.status);
    marked.setOptions({ headerIds: false, mangle: false });
    const whole = make("div");
    whole.innerHTML = marked.parse(await answer.text());
    tidy(whole);
    cards(whole);
    sections = chapters(whole.innerHTML);
    rail.replaceChildren(...sections.map(s => make("a", { href: "#" + (s.id === "intro" ? "" : s.id), text: s.title })));
    route();
  } catch (e) {
    doc.replaceChildren(make("p", { class: "state", text: WORDS[to].failed }));
  }
}

document.getElementById("lang-ru").addEventListener("click", () => load("ru"));
document.getElementById("lang-en").addEventListener("click", () => load("en"));
document.getElementById("home").addEventListener("click", e => { e.preventDefault(); location.hash = ""; route(); });
window.addEventListener("hashchange", route);
doc.addEventListener("click", e => {
  const img = e.target.closest("img");
  if (!img || img.closest(".card") || img.closest(".hero") || img.getAttribute("height") === "22") return; // an icon in the text is not a picture to look into
  document.getElementById("zoom-img").src = img.currentSrc || img.src;
  document.getElementById("zoom-text").textContent = img.alt;
  zoom.showModal();
});
zoom.addEventListener("click", () => zoom.close());
document.addEventListener("keydown", e => {
  if (zoom.open || e.target.matches("input") || location.hash !== "#first") return;
  if (e.key === "ArrowRight") document.getElementById("step-next")?.click();
  if (e.key === "ArrowLeft") document.getElementById("step-back")?.click();
});
load(remembered("kinetica-guide-language", (navigator.language || "ru").toLowerCase().startsWith("ru") ? "ru" : "en"));
</script>
