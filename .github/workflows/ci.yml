# Сборка и проверки на Linux и Windows; на Linux ещё проверка абляции.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC", os: ubuntu-latest }
          - { name: "Windows MSVC", os: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

  ablation:
    name: Только робототехника
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Нет нежёсткой физики, Box3D только в плагине, ядро без Qt
        run: |
          ! git grep -nIiE 'gas|plasma|fluid|cloth|soft ?bod|particle|fracture|mhd|smoke' -- src plugins tests editor shaders tools python examples CMakeLists.txt ':!tests/AblationTests.cpp'
          ! git grep -lI 'box3d/' -- src editor tests
          ! git grep -nIE '#include <Q' -- src
