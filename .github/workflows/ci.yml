# Сборка ядра и окна (Qt 6) на Linux (Ubuntu) и Windows, тесты ядра; на Linux - самотест окна под виртуальным экраном
# и проверка абляции. Готовые программы для скачивания: Windows (kinetica.exe с Qt) и Linux - одна папка со всеми
# библиотеками, собранная на Ubuntu 22.04 и запущенная на чистых 22.04 и 24.04 без Qt (снимок окна и вызов API).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Linux GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true
      - name: OpenGL, X11 и виртуальный экран
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
      - name: Build
        run: cmake --build build --parallel 4 # without a number make starts every compile at once and runs out of memory
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Самотест окна (программный OpenGL)
        timeout-minutes: 20
        env:
          KE_SOFTWARE_GL: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1600x1000x24" build/kinetica --self-test

  windows:
    name: Windows MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Готовая программа
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/kinetica.exe dist/
          windeployqt --release --no-translations dist/kinetica.exe
          Copy-Item -Recurse examples, python, catalog dist/
          New-Item -ItemType Directory dist/tools | Out-Null
          Copy-Item tools/ke_editor.py, tools/ke_editor_mcp.py dist/tools/
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md, README.md dist/
          Copy-Item extern/box3d/LICENSE dist/LICENSE-box3d.txt
          # The C++ runtime next to the program (Microsoft allows it): a clean Windows has no VCRUNTIME140.dll
          $crt = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -find "VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" | Select-Object -Last 1
          Copy-Item "$crt\*.dll" dist/
          foreach ($dll in "vcruntime140.dll", "msvcp140.dll") { if (!(Test-Path "dist/$dll")) { throw "the C++ runtime is not in the program: $dll" } }
          Get-ChildItem dist -Filter *.dll | ForEach-Object Name
      - name: Выложить программу
        uses: actions/upload-artifact@v4
        with:
          name: kinetica-windows
          path: dist/

  linux-bundle:
    name: Linux - программа одной папкой
    runs-on: ubuntu-22.04 # built on the older Ubuntu it runs on the newer ones too (glibc)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true
      - name: OpenGL и X11
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKE_TESTS=OFF -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          cmake --build build --parallel 4 --target kinetica
      - name: Программа, библиотеки Qt, примеры, лицензии - в одну папку
        run: packaging/bundle-linux.sh build "${{ env.QT_ROOT_DIR }}/bin/qmake"
      - uses: actions/upload-artifact@v4
        with:
          name: kinetica-linux
          path: build/kinetica-linux.tar.gz

  linux-clean:
    name: Linux - запуск на чистой ${{ matrix.os }}
    needs: linux-bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kinetica-linux
      - name: Только то, что есть на рабочем столе Ubuntu, и виртуальный экран (без Qt и без libxcb-cursor0)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libegl1 libfontconfig1 libxkbcommon-x11-0 libdbus-1-3 python3
      - name: Распаковать и запустить UR5e в игре, снимок окна
        run: |
          tar -xzf kinetica-linux.tar.gz
          xvfb-run -a -s "-screen 0 1600x1000x24" ./kinetica-linux/kinetica --scene kinetica-linux/usr/bin/examples/ur5e.kscene \
            --play --frames 120 --window --screenshot ur5e-${{ matrix.os }}.png
          test -s ur5e-${{ matrix.os }}.png
      - name: API для скриптов и агентов
        run: |
          xvfb-run -a ./kinetica-linux/kinetica --agent-eval --api 47801 --scene kinetica-linux/usr/bin/examples/ur5e.kscene &
          for i in $(seq 30); do python3 kinetica-linux/usr/bin/tools/ke_editor.py scene_list > list.json 2>/dev/null && break; sleep 1; done
          grep -q "UR5e" list.json && echo "API: $(grep -o '"name"' list.json | wc -l) objects"
      - uses: actions/upload-artifact@v4
        with:
          name: kinetica-linux-screenshot-${{ matrix.os }}
          path: ur5e-${{ matrix.os }}.png

  ablation:
    name: Только робототехника
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Нет нежёсткой физики, Box3D только в плагине, ядро без Qt
        run: |
          ! git grep -nIiE 'gas|plasma|fluid|cloth|soft ?bod|particle|fracture|mhd|smoke' -- src plugins tests editor shaders tools python examples CMakeLists.txt ':!tests/AblationTests.cpp'
          ! git grep -lI 'box3d/' -- src editor tests
          ! git grep -nIE '#include <Q' -- src
